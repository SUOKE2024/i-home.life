<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预算分析 · 云栖雅苑 · 智能整装</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #08080f; --card: #14141f; --border: #2a2a3a; --text: #e8e6e1;
    --dim: #8f8d98; --accent: #c9973b; --accent2: #4aa3c9;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 32px 20px 48px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 28px; }
  .sub b { color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 16px 10px;
  }
  .card h2 { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }
  .card .tag { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  .chart { width: 100%; height: 300px; }
  .full { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; font-size: 11.5px; }
  td:first-child, th:first-child { text-align: left; }
  td.cat { color: var(--accent2); }
  tfoot td { font-weight: 700; border-top: 2px solid var(--accent); }
  .note { color: var(--dim); font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>预算分析 · 云栖雅苑 · 智能整装（126㎡）</h1>
  <div class="sub">预算总额 <b>¥106,214</b> · 实际花费 ¥57,294 · 按物料类别分组（数据来源：seed_demo_data.py 逐项日志核对）</div>

  <div class="grid">
    <div class="card">
      <h2>按类别金额分布（柱状）</h2>
      <div class="tag">8 大装修类别 · 金额 ¥</div>
      <div id="chart-bar" class="chart"></div>
    </div>
    <div class="card">
      <h2>类别占比（饼图）</h2>
      <div class="tag">按预估金额占比</div>
      <div id="chart-pie" class="chart"></div>
    </div>
    <div class="card full">
      <h2>三个模拟项目预算对比</h2>
      <div class="tag">覆盖施工中 / 采购阶段 / 设计阶段</div>
      <div id="chart-projects" class="chart" style="height: 240px;"></div>
    </div>
    <div class="card full">
      <h2>预算明细表（9 项）</h2>
      <table>
        <thead><tr><th>类别</th><th>明细</th><th>数量</th><th>单位</th><th>单价</th><th>金额 ¥</th><th>占比</th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td colspan="5">合计</td><td id="total">106,214</td><td id="totalpct">100%</td></tr></tfoot>
      </table>
      <div class="note">占比按 ¥106,214 预估总额计算；实际花费 ¥57,294（已发生：地砖/吊顶/厨卫/水电）</div>
    </div>
  </div>
</div>

<script>
const CATS = [
  { name: '地面', amount: 16236 },
  { name: '墙面', amount: 2720 },
  { name: '顶面', amount: 4370 },
  { name: '厨卫', amount: 15520 },
  { name: '水电', amount: 21168 },
  { name: '定制', amount: 30720 },
  { name: '软装', amount: 2680 },
  { name: '家电', amount: 12800 },
]
const TOTAL = 106214
const LINES = [
  ['地面', '750×1500 大板砖', 82.0, '㎡', 198, 16236],
  ['墙面', '净味乳胶漆（全屋）', 4.0, '桶', 680, 2720],
  ['顶面', '石膏板吊顶', 46.0, '㎡', 95, 4370],
  ['厨卫', '石英石台面 + 台下盆', 1.0, '项', 9860, 9860],
  ['厨卫', '智能马桶 + 恒温花洒', 1.0, '套', 5660, 5660],
  ['水电', '强弱电改造（含材料）', 126.0, '㎡', 168, 21168],
  ['定制', '定制衣柜（主卧+次卧）', 24.0, '㎡', 1280, 30720],
  ['软装', 'LED 无主灯全屋套餐', 1.0, '套', 2680, 2680],
  ['家电', '中央空调一拖四', 1.0, '套', 12800, 12800],
]
const PROJECTS = [
  ['云栖雅苑 · 智能整装', 106214, '施工中'],
  ['滇池湖畔 · 现代简约', 59829, '采购阶段'],
  ['翠湖名邸 · 原木奶油风', 88160, '设计阶段'],
]
const GOLD = '#c9973b', BLUE = '#4aa3c9'

// 表格
const fmt = (n) => n.toLocaleString('zh-CN')
const rows = document.getElementById('rows')
LINES.forEach(([cat, name, qty, unit, price, amount]) => {
  const tr = document.createElement('tr')
  tr.innerHTML = `<td class="cat">${cat}</td><td>${name}</td><td>${qty}</td><td>${unit}</td>` +
    `<td>${fmt(price)}</td><td>${fmt(amount)}</td><td>${(amount / TOTAL * 100).toFixed(1)}%</td>`
  rows.appendChild(tr)
})

const axisBase = {
  axisLine: { lineStyle: { color: '#3a3a4a' } },
  axisLabel: { color: '#8f8d98' },
  splitLine: { lineStyle: { color: '#22222e' } },
}
const label = { color: '#e8e6e1' }

// 柱状图（按类别）
echarts.init(document.getElementById('chart-bar')).setOption({
  tooltip: { trigger: 'axis', valueFormatter: (v) => '¥' + fmt(v) },
  grid: { left: 52, right: 16, top: 16, bottom: 28 },
  xAxis: { type: 'category', data: CATS.map(c => c.name), ...axisBase },
  yAxis: { type: 'value', ...axisBase },
  series: [{
    type: 'bar', data: CATS.map(c => c.amount),
    barWidth: 34,
    itemStyle: {
      color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: '#e0b35e' }, { offset: 1, color: '#8a6415' }]),
      borderRadius: [6, 6, 0, 0],
    },
    label: { show: true, position: 'top', formatter: (p) => fmt(p.value), color: '#8f8d98', fontSize: 10.5 },
  }],
})

// 饼图
echarts.init(document.getElementById('chart-pie')).setOption({
  tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
  legend: { bottom: 0, textStyle: label, itemWidth: 12, itemHeight: 12 },
  series: [{
    type: 'pie', radius: ['42%', '68%'], center: ['50%', '44%'],
    itemStyle: { borderColor: '#14141f', borderWidth: 2, borderRadius: 4 },
    label: { color: '#8f8d98', fontSize: 11, formatter: '{b} {d}%' },
    data: CATS.map(c => ({ name: c.name, value: c.amount })),
  }],
})

// 项目对比
echarts.init(document.getElementById('chart-projects')).setOption({
  tooltip: { trigger: 'axis', valueFormatter: (v) => '¥' + fmt(v) },
  grid: { left: 60, right: 16, top: 16, bottom: 28 },
  xAxis: { type: 'category', data: PROJECTS.map(p => p[0]), ...axisBase },
  yAxis: { type: 'value', ...axisBase },
  series: [{
    type: 'bar', data: PROJECTS.map(p => p[1]),
    barWidth: 42,
    itemStyle: { color: BLUE, borderRadius: [6, 6, 0, 0] },
    label: { show: true, position: 'top', formatter: (p) => fmt(p.value), color: '#8f8d98', fontSize: 10.5 },
  }],
})
</script>
</body>
</html>
