name: ihome_app
description: "索克家居 · i-home.life"
publish_to: 'none'
version: 1.15.1+50

# 版本治理说明（v1.3.0）：
# - 鸿蒙端：Flutter-OH 3.35.7-ohos-0.0.3 / Dart 3.9.2（DevEco Studio 6.0.2 / OpenHarmony API 23+）
# - Android/iOS 端：走系统 Flutter 3.41.7 / Dart 3.11.5（CI 守门见 scripts/check-dart-compat.sh）
# - 仓库: https://atomgit.com/openharmony-tpc/flutter_flutter (分支 oh-3.35.7-dev)
# - 约束：不使用 Dart 3.10+ 语法，保证鸿蒙端可编译
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 网络 & 持久化
  http: ^1.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  connectivity_plus: ^7.2.0
  # 文件选择 & 图片
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.1.0
  # 网络图片缓存（F2: 替换 Image.network 避免重复下载 + 占位符/错误态）
  # 鸿蒙兼容性：cached_network_image 在 OHOS 上未官方支持，依赖其 errorWidget
  # 兜底显示占位图（4 个使用点：chat_message_card / ai_image_page / points_page / vr_panorama_page）。
  # TODO: 鸿蒙真机验证后若 errorWidget 不可用，需降级为 Image.network + try-catch
  cached_network_image: ^3.4.1
  # 状态管理
  provider: ^6.1.2
  # 生物识别认证（指纹/面容）
  # 注意: 仅 Android/iOS 完整支持；鸿蒙平台会自动降级为关闭
  local_auth: ^3.0.2
  # 本地通知
  # 注意: 仅 Android/iOS 完整支持；鸿蒙平台通过 try-catch 优雅降级
  flutter_local_notifications: ^22.0.1
  # 平台权限请求（通知/相机等）
  permission_handler: ^13.0.0
  # 传感器（加速度计/陀螺仪/磁力计）— Dart 层跨平台读取
  # 注意: 仅 Android/iOS 完整支持；鸿蒙平台通过 try-catch 优雅降级
  sensors_plus: ^7.1.0
  # GPS 定位 — 场景自动化地理触发 + AR 校准
  # 注意: 仅 Android/iOS 完整支持；鸿蒙平台通过 try-catch 优雅降级
  geolocator: ^14.0.3
  # 工具
  intl: ^0.20.3
  uuid: ^4.4.0
  # 打开外部链接（使用指南/隐私政策/服务条款/备案号，对齐 webapp 公开路由）
  # 注意：鸿蒙端依赖 ohos 实现（openHarmony-tpc flutter_packages），
  # 启动失败时 url_opener.dart 降级为复制链接到剪贴板。
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # F5: 集成测试框架 — 真机/模拟器端到端冒烟测试
  # 运行: flutter test integration_test/smoke_test.dart
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2026-08-16 CI 修复：image_picker_android 0.8.13+17 起在其 build.gradle.kts
  # 使用 kotlin{compilerOptions{}} DSL 但未在 plugins{} 块应用 kotlin-android
  # （依赖宿主侧自动应用，面向 AGP9/新 Flutter），在本项目 Flutter 3.41.7 +
  # KGP 2.2.20 下脚本编译失败（Unresolved reference: compilerOptions），
  # Android release 构建必挂（CI apk-size-budget / flutter-perf-baseline 自 #82 起）。
  # pin 回 +16（无 kotlin DSL 用法，运行期由 Flutter 插件加载器应用 Kotlin）。
  image_picker_android: 0.8.13+16
  # 同批损坏（2026-08-16 扫描 pubspec.lock 全量 Android 插件确认共 5 个），
  # 均为同一模式：build.gradle.kts 用 kotlin{compilerOptions{}} DSL 但 plugins{}
  # 块未应用 kotlin-android（注释掉，面向 AGP9），KGP 2.2.20 下脚本编译失败。
  # 各回退一个版本（经 pub.dev archive 逐一验证为无此问题）：
  local_auth_android: 2.0.7            # 坏 2.0.8 → 好 2.0.7（无 kotlin DSL）
  permission_handler_android: 13.0.1   # 坏 14.0.0 → 好 13.0.1（groovy gradle）
  shared_preferences_android: 2.4.22   # 坏 2.4.23 → 好 2.4.22（DSL 有插件应用）
  url_launcher_android: 6.3.29         # 坏 6.3.30 → 好 6.3.29（无 kotlin DSL）

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/hand-drawn-profiles/

  # 使用系统默认字体，DM Sans 通过 CSS font-family 在 Web 端加载
