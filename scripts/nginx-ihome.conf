# i-home.life nginx 配置 v2.1.1 — stream ssl_preread 分流
# 放置路径: /etc/nginx/conf.d/ihome.conf
# 重启: nginx -t && nginx -s reload
#
# v2.1.1（2026-08-08）：favicon.ico → /favicon.png 301 兜底（public 无 ico 文件）
# v2.1.0（2026-08-08）：HSTS 正式启用（443/8085 均加头，LE 证书已接入）+ 8085 块补齐
#   语音 WebSocket 精确匹配（与 8084/443 对齐）+ 证书路径统一为 Let's Encrypt。
# v2.0.0 修复：使用 stream ssl_preread 实现 8081 端口同时支持 HTTP 和 HTTPS。
# 外部 8081 → stream ssl_preread 协议检测 → 内部 8084(HTTP) / 8085(HTTPS)
#
# 前置条件：
#   1. Nginx >= 1.20.1 + stream 模块（ngx_stream_module.so）
#   2. nginx.conf 中需加载 stream 模块并包含 stream { include /etc/nginx/stream.d/*.conf; }
#   3. Let's Encrypt 证书：/etc/letsencrypt/live/i-home.life/{fullchain,privkey}.pem
#      （443 与 8085 块共用；签发见 scripts/fix-8081-https.sh 提示）
#
# 配套文件：
#   - /etc/nginx/stream.d/ihome-8081.conf（stream ssl_preread 分流规则）
#   - 执行 sudo bash scripts/fix-8081-https.sh 一键修复

# ── 内部 HTTP server（接收 stream 转发的纯 HTTP 流量） ──
server {
    listen 127.0.0.1:8084;
    server_name i-home.life www.i-home.life 118.31.223.213;

    server_tokens off;
    client_max_body_size 20m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob:; worker-src 'self' blob:;" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), gyroscope=(self), accelerometer=(self), magnetometer=(self), xr-spatial-tracking=(self)" always;

    root /opt/ihome/webapp/dist;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Prometheus 指标端点 — 代理到 FastAPI，绕过 SPA fallback（v1.12.x）
    location = /metrics {
        proxy_pass http://127.0.0.1:8001/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /docs { return 301 /api/docs; }
    location = /docs/ { return 301 /api/docs; }
    location = /redoc { return 301 /api/redoc; }
    location = /redoc/ { return 301 /api/redoc; }
    location = /openapi.json { return 301 /api/openapi.json; }

    # Old PWA service worker (removed v1.2.3) — self-destructing sw.js
    # 曾部署于旧 web/（已迁移至 webapp/dist，React SPA 无 service worker）
    # no-cache headers ensure browsers always re-fetch the self-destructing script.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 防御 Vite 等开发工具注入 /@vite/client 导致 SPA fallback 返回 HTML-as-JS
    location = /@vite/client {
        return 204;
    }

    # A2A Agent Card 公开端点 — 代理到 FastAPI，绕过 SPA fallback
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # v1.2.7: Web 控制台 v2（React+Vite 构建产物），由 Nginx 直接服务
    location /console/ {
        try_files $uri $uri/ /console/index.html;
    }

    # favicon.ico 兜底（public 仅提供 favicon.png）
    location = /favicon.ico {
        return 301 /favicon.png;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 实时语音 WebSocket（Qwen-Audio-3.0-Realtime 双工，v1.2.7）
    # 精确匹配优先于 ^~ /api/，注入 WS 升级头避免 404
    location = /api/voice/realtime {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Agent LLM 调用（推理模型耗时 60-180 秒，需更长超时）
    location ^~ /api/agents/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;  # SSE 流式响应需关闭缓冲
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Flutter CanvasKit WebAssembly (wasm) — 必须使用 application/wasm MIME 类型
    # Chrome 要求 nosniff + application/wasm，否则拒绝编译
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        gzip off;
        expires -1;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 1000;
}

# ════════════════════════════════════════════════════════════════
# 以下为独立 conf 文件内容（2026-08-08 追加，与 ihome.conf 同目录加载）：
#   - ihome-acme.conf：80 端口 HTTP→HTTPS 301 跳转 + Let's Encrypt HTTP-01 验证
#   - ihome-443.conf ：443 端口 HTTPS（Let's Encrypt 正规证书，webapp/dist）
# 部署时可将本段拆分为两个文件，或整体保留（nginx 允许单文件多 server 块）。
# ════════════════════════════════════════════════════════════════

# ── i-home.life HTTP → HTTPS 跳转 + ACME 验证（= ihome-acme.conf）──
server {
    listen 80;
    listen [::]:80;
    server_name i-home.life www.i-home.life;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── i-home.life HTTPS（Let's Encrypt 证书，= ihome-443.conf）──
# 证书路径：/etc/letsencrypt/live/i-home.life/{fullchain,privkey}.pem
# 与 suoke.life 等 443 server 共存，按 server_name/SNI 分发
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name i-home.life www.i-home.life;

    ssl_certificate     /etc/letsencrypt/live/i-home.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i-home.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_ihome:10m;
    ssl_session_timeout 1d;
    # HSTS（2026-08-08 LE 正规证书已接入，正式启用；max-age=1年，含子域名）
