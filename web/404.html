<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - 页面未找到 | 索克家居</title>
  <meta name="description" content="您访问的页面不存在。返回索克家居首页。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/images/icons/desktop/suoke-favicon-32.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #08080f;
      --surface1: #12121d;
      --surface2: #1a1a2a;
      --border: #1e1e32;
      --text-primary: #e8e6e1;
      --text-secondary: #8a8894;
      --text-muted: #6b6978;
      --accent: #c9973b;
      --accent-bright: #e0aa4a;
      --on-accent: #08080f;
    }
    [data-theme='light'] {
      --bg-deep: #f8f7f4;
      --surface1: #ffffff;
      --surface2: #f0eee8;
      --border: #e8e5de;
      --text-primary: #1a1814;
      --text-secondary: #6b6760;
      --text-muted: #9e9a94;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
    }
    .code {
      font-size: 8rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .message {
      font-size: 1.5rem;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
    }
    .detail {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      min-height: 44px;
      line-height: 44px;
      padding: 0 2rem;
      background: var(--accent);
      color: var(--on-accent);
      text-decoration: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-bright); }
    .logo {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-top: 2rem;
    }
  </style>
  <script>
    // 跟随系统浅色/深色偏好（对齐 workbench.css 设计令牌）
    if (window.matchMedia && !localStorage.getItem('theme')) {
      if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="message">页面未找到</div>
    <div class="detail">
      您访问的页面可能已被移除、链接失效或地址输入有误。<br>
      请检查 URL 或返回首页。
    </div>
    <a href="/" class="btn">返回首页</a>
    <div class="logo">索克家居 · i-home.life</div>
  </div>
</body>
</html>
