<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到 | 索克家居</title>
  <meta name="description" content="您访问的页面不存在。返回索克家居首页。">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    .code {
      font-size: 8rem;
      font-weight: 800;
      color: #0175C2;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .message {
      font-size: 1.5rem;
      color: #555;
      margin-bottom: 1.5rem;
    }
    .detail {
      font-size: 0.95rem;
      color: #777;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #0175C2;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #01579B; }
    .logo {
      font-size: 1.2rem;
      color: #999;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="message">页面未找到</div>
    <div class="detail">
      您访问的页面可能已被移除、链接失效或地址输入有误。<br>
      请检查 URL 或返回首页。
    </div>
    <a href="/" class="btn">返回首页</a>
    <div class="logo">索克家居 · i-home.life</div>
  </div>
</body>
</html>
